steps:
  # 1. Run automated KPF unit tests
  - name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['test']

  # 2. Build backend container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/zelda-screen-quest:$COMMIT_SHA', '.']

  # 3. Push container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/zelda-screen-quest:$COMMIT_SHA']

  # 4. Deploy container to GCP Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'zelda-screen-quest'
      - '--image=gcr.io/$PROJECT_ID/zelda-screen-quest:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'

images:
  - 'gcr.io/$PROJECT_ID/zelda-screen-quest:$COMMIT_SHA'
